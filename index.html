<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conserbio Reviewer</title>
</head>
<body style="background-color: black; color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; margin: 0; padding: 0; height: 100vh; display: flex; align-items: center; justify-content: center;">

    <!-- Hidden Audio Player -->
    <audio id="prankSound" src="error.mp3" preload="auto"></audio>

    <!-- The Fake Error Box Screen -->
    <div id="errorBox" style="background-color: #1e1e1e; border: 2px solid #ff3333; padding: 30px; border-radius: 12px; max-width: 85%; box-shadow: 0px 10px 30px rgba(255, 51, 51, 0.3);">
        <!-- Big Error Icon -->
        <div id="errorIcon" style="font-size: 50px; margin-bottom: 15px; color: #ff3333;">❌</div>
        
        <!-- Error Title -->
        <h2 id="errorTitle" style="margin: 0 0 15px 0; font-size: 20px; text-transform: uppercase; letter-spacing: 1px;">System Failure</h2>
        
        <!-- Error Message Text -->
        <p id="errorText" style="font-size: 16px; line-height: 1.5; color: #cccccc; margin-bottom: 25px;">
            CRITICAL ERROR: 'conserbio_reviewer.pdf' is corrupted.
        </p>
        
        <!-- Interactive Button -->
        <button id="actionBtn" onclick="nextStep()" style="background-color: #ff3333; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; max-width: 200px; transition: 0.2s;">
            OK
        </button>
    </div>

    <script>
        var currentStep = 1;
        var sound = document.getElementById("prankSound");

        function nextStep() {
            if (currentStep === 1) {
                // Play your uploaded error.mp3 file instantly!
                sound.play().catch(function(error) {
                    console.log("Audio play blocked: ", error);
                });

                // Change the box to the scary step 2
                document.getElementById("errorIcon").innerHTML = "⚠️";
                document.getElementById("errorIcon").style.color = "#ffcc00";
                document.getElementById("errorBox").style.borderColor = "#ffcc00";
                document.getElementById("errorTitle").innerHTML = "WARNING";
                document.getElementById("errorText").innerHTML = "Attempting to isolate the threat... Failed. Phone files are being deleted.";
                document.getElementById("actionBtn").style.backgroundColor = "#ffcc00";
                document.getElementById("actionBtn").style.color = "black";
                
                currentStep = 2;
            } else if (currentStep === 2) {
                // Stop the sound for the joke reveal
                sound.pause();

                // Show the prank reveal screen
                document.getElementById("errorIcon").innerHTML = "🐱";
                document.getElementById("errorTitle").innerHTML = "PRANKED";
                document.getElementById("errorText").innerHTML = "Just kidding! Gotcha! 😂 Happy studying!";
                document.getElementById("errorBox").style.borderColor = "#4cd964";
                document.getElementById("actionBtn").style.backgroundColor = "#4cd964";
                document.getElementById("actionBtn").style.color = "white";
                document.getElementById("actionBtn").innerHTML = "Close Reviewer";
                
                currentStep = 3;
            } else {
                // When they click the final button, it closes out or changes
                document.getElementById("errorBox").innerHTML = "<h2 style='color:#4cd964;'>Enjoy your day! 👋</h2>";
            }
        }
    </script>
</body>
</html>
